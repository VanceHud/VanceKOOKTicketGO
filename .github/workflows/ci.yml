name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（gofmt / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查 gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "以下文件未格式化，请执行 gofmt -w .："
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend:
    name: 前端（lint / test / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - run: npm ci

      - name: oxlint
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build

  # 单个 job 汇总所有必填检查，方便在分支保护里只勾选这一项。
  ci-ok:
    name: 全部通过
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "有前置 job 未通过：${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "后端与前端检查均已通过"
